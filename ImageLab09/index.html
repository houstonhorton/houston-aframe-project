<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
     <script src="https://unpkg.com/aframe-environment-component/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <a-scene>
      <!-- <a-box position="-1 0.5 -3" rotation="0 45 0" color="#4CC3D9"></a-box> -->
      <a-sphere position="0 1 -8" radius="3" color="white"></a-sphere>
      <a-sphere position="0 4 -8" radius="2" color="white"></a-sphere>
      <a-sphere position="0 6 -8" radius="1" color="white"></a-sphere>
      <a-cylinder position="0 7 -8" radius="0.5" height="6" color="black"></a-cylinder>
      <a-cylinder position="0 7 -8" radius="1" height="0.25" color="black"></a-cylinder>
      <a-cone position="0 6 -7" rotation = "90 0 0" radius-bottom=".25" height="2" color="orange"></a-cone>
      <a-plane position="0 0.1 -9" rotation="-90 0 0" width="100" height="100" color="white"></a-plane>
      <!-- <a-sky color="#ECECEC"></a-sky> -->
      <!-- the enviroment entity includes a sky. Choose from the presets"none, default, contact, egypt, checkerboard, forest, goaland, yavapai, goldmine, threetowers, poison, arches, tron, japan, dream, volcano, starry, osiris, moon" -->
      <a-entity environment="preset: starry; dressingAmount: 500"></a-entity>
    </a-scene>
  </body>
</html>
